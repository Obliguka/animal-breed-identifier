# =============================================================================
# Animal Breed Identifier — полный Docker-стек
# =============================================================================
# Запуск:  docker compose up -d
# Остановка: docker compose down
#
# После запуска:
#   API быстрый:    http://localhost:8000
#   API точный:     http://localhost:8001
#   Langfuse:       http://localhost:3000
#   LiteLLM:        http://localhost:4000
#
# Агент (интерактивный):
#   docker compose run --rm agent
#
# ❗ Ollama должна быть установлена на хосте (http://localhost:11434)
#    Модели: ollama pull llava, ollama pull llama3.2-vision
# =============================================================================

services:

  # ===========================================================================
  # API — быстрый (порт 8000)
  # ===========================================================================
  api8000:
    build:
      context: ..
      dockerfile: demo/Dockerfile.api8000
    container_name: animal-api-8000
    ports:
      - "8000:8000"
    environment:
      - LITELLM_PROXY_URL=http://litellm:4000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm:
        condition: service_started
    restart: unless-stopped

  # ===========================================================================
  # API + RAG — точный (порт 8001)
  # ===========================================================================
  api8001:
    build:
      context: ..
      dockerfile: demo/Dockerfile.api8001
    container_name: animal-api-8001
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ===========================================================================
  # Агент (интерактивный CLI)
  # Запуск: docker compose run --rm agent
  # ===========================================================================
  agent:
    build:
      context: ..
      dockerfile: demo/Dockerfile.agent
    container_name: animal-agent
    profiles:
      - agent
    depends_on:
      - api8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

  # ===========================================================================
  # MONITORING: Langfuse + LiteLLM
  # ===========================================================================

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.8-alpine
    user: "101:101"
    container_name: langfuse-clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: langfuse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9090:9000"
      - "9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  zookeeper:
    image: docker.io/zookeeper:3.9
    container_name: langfuse-zookeeper
    restart: always
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    ports:
      - "2181:2181"

  redis:
    image: docker.io/redis:7.2.4
    container_name: langfuse-redis
    restart: always
    command: --requirepass myredissecret --maxmemory-policy noeviction
    ports:
      - "6379:6379"

  postgres:
    image: docker.io/postgres:17
    container_name: langfuse-postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    container_name: langfuse-web
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_SECRET: my-super-secret-change-me-12345
      NEXTAUTH_URL: http://localhost:3000
      SALT: change_me_salt
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio123
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: myredissecret
    restart: unless-stopped

  litellm-db:
    image: postgres:15
    container_name: litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    depends_on:
      - litellm-db
    environment:
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: sk-litellm-master-key-123
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    restart: unless-stopped


# =============================================================================
# Volumes
# =============================================================================
volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  litellm_db_data:

networks:
  default:
    name: animal-breed-network
    driver: bridge
